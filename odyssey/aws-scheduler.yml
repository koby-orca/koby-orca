AWSTemplateFormatVersion: "2010-09-09"
Description: Dispatch the Odyssey GitHub Actions workflow every five minutes.

Parameters:
  GitHubTokenSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing a GitHub token.
  GitHubRepository:
    Type: String
    Default: koby-orca/koby-orca
  GitHubWorkflow:
    Type: String
    Default: check-odyssey.yml
  GitHubRef:
    Type: String
    Default: main

Resources:
  DispatcherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadGitHubToken
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GitHubTokenSecretArn

  DispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: koby-odyssey-github-dispatch
      Description: Dispatch the Odyssey watcher workflow on GitHub Actions.
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt DispatcherRole.Arn
      Timeout: 30
      Environment:
        Variables:
          GITHUB_REF: !Ref GitHubRef
          GITHUB_REPOSITORY: !Ref GitHubRepository
          GITHUB_SECRET_ARN: !Ref GitHubTokenSecretArn
          GITHUB_WORKFLOW: !Ref GitHubWorkflow
      Code:
        ZipFile: |
          import json
          import os
          import urllib.error
          import urllib.request

          import boto3

          secrets = boto3.client("secretsmanager")


          def handler(event, context):
              token = secrets.get_secret_value(
                  SecretId=os.environ["GITHUB_SECRET_ARN"]
              )["SecretString"].strip()
              repository = os.environ["GITHUB_REPOSITORY"]
              workflow = os.environ["GITHUB_WORKFLOW"]
              url = (
                  f"https://api.github.com/repos/{repository}/actions/"
                  f"workflows/{workflow}/dispatches"
              )
              request = urllib.request.Request(
                  url,
                  data=json.dumps({"ref": os.environ["GITHUB_REF"]}).encode(),
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "koby-odyssey-aws-scheduler",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub dispatch failed with HTTP {exc.code}: {body}"
                  ) from exc

              print(json.dumps({"repository": repository, "status": status}))
              return {"statusCode": status}

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDispatcher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DispatcherFunction.Arn

  FiveMinuteSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: koby-odyssey-every-five-minutes
      Description: Dispatch the Odyssey watcher on GitHub every five minutes.
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt DispatcherFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"
        RetryPolicy:
          MaximumEventAgeInSeconds: 300
          MaximumRetryAttempts: 2

Outputs:
  DispatcherFunctionName:
    Value: !Ref DispatcherFunction
  ScheduleName:
    Value: !Ref FiveMinuteSchedule
