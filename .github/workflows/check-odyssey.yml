name: Check Odyssey IMAX 70mm

on:
  # A workflow-file push also acts as a bootstrap/resync trigger when GitHub's
  # scheduler has not registered a newly created cron workflow yet.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-odyssey.yml"
  schedule:
    # GitHub cron is UTC. Offset the five-minute cadence from round boundaries
    # because scheduled workflows can be delayed during periods of high load.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_slack:
        description: Send a Slack test message before checking Cinema City
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-odyssey
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: U027888MD19

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Require Slack token
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "::error::Repository secret SLACK_BOT_TOKEN is not configured."
            exit 1
          fi

      - name: Send Slack test notification
        if: ${{ inputs.test_slack }}
        run: python odyssey/check_odyssey.py --test-slack

      - name: Check Cinema City
        run: python odyssey/check_odyssey.py

      - name: Persist notification state
        run: |
          if git diff --quiet -- odyssey/known_dates.json; then
            echo "No watcher state changes to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odyssey/known_dates.json
          git commit -m "chore: update Odyssey watcher state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
